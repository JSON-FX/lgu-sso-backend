# Append to the existing office proxy after both SSO services are healthy.
# The proxy must join lgu-sso-ingress. Reload Nginx after recreating an SSO service.
server {
    listen 443 ssl;
    http2 on;
    server_name api.sso.lguquezon.local;
    ssl_certificate /etc/nginx/certs/sso.lguquezon.local.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/sso.lguquezon.local.key;
    client_max_body_size 10M;

    location / {
        proxy_pass http://lgu-sso-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name sso.lguquezon.local;
    ssl_certificate /etc/nginx/certs/sso.lguquezon.local.fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/sso.lguquezon.local.key;
    client_max_body_size 10M;

    location / {
        proxy_pass http://lgu-sso-portal:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
