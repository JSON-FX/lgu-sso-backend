[www]
clear_env = no

; Only the exact internal batch route reaches this pool. Keep normal login work separate.
[sso-batch]
user = laravel
group = laravel
listen = 9001
listen.backlog = 1
pm = static
pm.max_children = 1
pm.max_requests = 100
clear_env = no
catch_workers_output = yes
request_terminate_timeout = 6s
request_terminate_timeout_track_finished = yes
php_admin_value[memory_limit] = 128M
php_admin_value[max_execution_time] = 4
