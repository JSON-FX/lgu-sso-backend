limit_conn_zone $server_name zone=sso_batch:32k;

server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 6m;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    location = /api/v1/sso/authorize-batch {
        client_max_body_size 192k;
        limit_conn sso_batch 1;
        limit_conn_status 503;
        error_page 502 503 504 = @sso_batch_busy;
        error_page 413 = @sso_batch_too_large;
        add_header Cache-Control "private, no-store" always;
        fastcgi_pass sso-backend:9001;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param SSO_BATCH_POOL 1;
        fastcgi_connect_timeout 1s;
        fastcgi_read_timeout 8s;
    }

    location @sso_batch_busy {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        add_header Retry-After 1 always;
        return 503 '{"message":"SSO verification is temporarily unavailable."}';
    }

    location @sso_batch_too_large {
        default_type application/json;
        add_header Cache-Control "private, no-store" always;
        return 413 '{"message":"Authorization request is too large."}';
    }

    location /storage/ {
        alias /app/storage/app/public/;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass sso-backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_read_timeout 60s;
        internal;
    }

    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
